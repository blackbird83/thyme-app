<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>thyme — Passwort zurücksetzen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0805; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap');
  .card { background: #1C1408; border: 1px solid #3D3020; border-radius: 16px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: #B8973A; letter-spacing: 4px; margin-bottom: 4px; }
  .sub { font-size: 12px; letter-spacing: 3px; color: #5C7F5D; text-transform: uppercase; margin-bottom: 32px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #C4A882; margin-bottom: 8px; font-weight: 300; }
  p { font-size: 14px; color: #888070; margin-bottom: 24px; line-height: 1.6; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #B8973A; margin-bottom: 8px; text-align: left; }
  input { width: 100%; background: #221A0E; border: 1px solid #3D3020; border-radius: 10px; padding: 13px 16px; font-size: 16px; color: #C4A882; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 16px; }
  input:focus { border-color: #B8973A; }
  button { width: 100%; padding: 14px; background: #3D5A3E; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; }
  .msg { font-size: 14px; padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .msg.ok { background: rgba(61,90,62,.3); color: #5C7F5D; border: 1px solid #3D5A3E; }
  .msg.err { background: rgba(139,26,26,.3); color: #F09595; border: 1px solid #8B1A1A; }
  .back { font-size: 13px; color: #B8973A; text-decoration: none; display: inline-block; margin-top: 8px; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">thyme</div>
  <div class="sub">Recipe Archive</div>
  <h2>Passwort zurücksetzen</h2>
  <div id="msg-ok" class="msg ok"></div>
  <div id="msg-err" class="msg err"></div>
  <div id="form-new" style="display:none">
    <p>Neues Passwort eingeben:</p>
    <label>Neues Passwort</label>
    <input type="password" id="new-pw" placeholder="Mindestens 6 Zeichen" minlength="6">
    <label>Passwort bestätigen</label>
    <input type="password" id="confirm-pw" placeholder="Passwort wiederholen">
    <button onclick="setNewPassword()">Passwort speichern</button>
  </div>
  <div id="form-email" style="display:none">
    <p>Gib deine E-Mail-Adresse ein um einen Reset-Link zu erhalten.</p>
    <label>E-Mail</label>
    <input type="email" id="reset-email" placeholder="email@example.com">
    <button onclick="sendReset()">Reset-Link senden</button>
  </div>
  <a href="https://blackbird83.github.io/thyme-app/" class="back">← Zurück zur App</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://gzfthrcubvafdkgacrkn.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6ZnRocmN1YnZhZmRrZ2FjcmtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NzA5NzMsImV4cCI6MjA5MTE0Njk3M30.-4uUhFwlGz3xhXkKwGPWZukeQ1REhLKyP-QezwcPVqc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showMsg(type, text) {
  document.getElementById('msg-ok').style.display = 'none';
  document.getElementById('msg-err').style.display = 'none';
  var el = document.getElementById('msg-' + type);
  el.textContent = text;
  el.style.display = 'block';
}

// Prüfen ob Reset-Token in URL
window.addEventListener('load', async function() {
  var hash = window.location.hash;
  var params = new URLSearchParams(hash.replace('#', '?'));
  var type = params.get('type');
  var accessToken = params.get('access_token');
  
  if (type === 'recovery' && accessToken) {
    // Neues Passwort setzen
    await db.auth.setSession({access_token: accessToken, refresh_token: params.get('refresh_token') || ''});
    document.getElementById('form-new').style.display = 'block';
  } else {
    // Reset-Link anfordern
    document.getElementById('form-email').style.display = 'block';
  }
});

async function sendReset() {
  var email = document.getElementById('reset-email').value.trim();
  if (!email) { showMsg('err', 'Bitte E-Mail eingeben'); return; }
  var res = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://blackbird83.github.io/thyme-app/reset-password.html'
  });
  if (res.error) { showMsg('err', res.error.message); return; }
  showMsg('ok', 'Reset-Link wurde gesendet! Bitte prüfe dein Postfach.');
  document.getElementById('form-email').style.display = 'none';
}

async function setNewPassword() {
  var pw = document.getElementById('new-pw').value;
  var pw2 = document.getElementById('confirm-pw').value;
  if (pw.length < 6) { showMsg('err', 'Passwort mind. 6 Zeichen'); return; }
  if (pw !== pw2) { showMsg('err', 'Passwörter stimmen nicht überein'); return; }
  var res = await db.auth.updateUser({password: pw});
  if (res.error) { showMsg('err', res.error.message); return; }
  showMsg('ok', 'Passwort gespeichert! Du kannst dich jetzt anmelden.');
  document.getElementById('form-new').style.display = 'none';
  setTimeout(function(){ window.location.href = 'https://blackbird83.github.io/thyme-app/'; }, 2000);
}
</script>
</body>
</html>
